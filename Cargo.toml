[package]
name = 'quickjs-wasm'
version = '0.2.0'
authors = [
    '韩朴宇',
    '胡昀霏',
]
edition = '2021'
license = 'MIT'

[build-dependencies]
cc = "1.0"

[dependencies]
rquickjs = { path = './rquickjs', default-features = false, features = [
    'bindgen',
    'properties',
    'macro',
    'array-buffer',
    'classes',
	'loader',
] }
once_cell = '1.0'
defer-lite = "1.0.0"
runtime = { path = "../iwasm-rs/runtime", default-features = false, features = ["std", "mmap", "disable-alltargets-init", "libloading", "threads", "quickjs-wasm"] }
libc = { version = "0.2", optional = true }
wasi-common = { version = "36.0", default-features = false, features = ["sync"], optional=true }
wiggle = { version = "36.0", default-features = false, optional = true }

[workspace]
resolver = '2'
members = [
    'rquickjs/sys',
    'rquickjs/core',
    'rquickjs/macro',
    'rquickjs',
    '.',
    'xtask'
]

[features]
# default = ["quickjs-libc", "target-android", "target-aarch64", "jit"]
# default = ["quickjs-libc", "external-aot", "quickjs-libc-test"]
default = ["quickjs-libc", "external-aot", "max-rss", "wasi"]

quickjs-libc = ["rquickjs/quickjs-libc"]

quickjs-libc-test = ["rust-allocator", "rquickjs/quickjs-libc-test"]

wasi = ["wasi-common", "wiggle"]

target-x86 = ["runtime/target-x86"]
target-aarch64 = ["runtime/target-aarch64"]
target-arm = ["runtime/target-arm"]
target-riscv = ["runtime/target-riscv"]
target-android = ["runtime/no-llvm-linking", "runtime/no-libffi-linking"]
external-aot = ["runtime/external_aot"]
rust-allocator = ["rquickjs/allocator"]
jit = ["runtime/jit"]
max-rss = ["libc"]

# override opt-level for all dependencies (but not any workspace member)
[profile.dev.package."*"]
opt-level = 2

